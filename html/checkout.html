<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria CLS | Finalizar Compra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-stone-50 text-stone-800">

    <nav class="bg-navy text-white sticky top-0 z-50 border-b border-amber-500/20">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <a href="index.html" class="logo-font text-3xl font-black">Livraria <span class="text-gold">CLS</span></a>
            <a href="carrinho.html" class="nav-link">Voltar ao Carrinho</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-16">
        <h1 class="text-4xl font-black logo-font mb-8">Finalizar Compra</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-stone-200 space-y-4">
                <h3 class="font-bold text-xl mb-4 logo-font">1. Endereço e Frete</h3>
                <input type="text" placeholder="CEP (ex: 01000-000)" class="w-full p-4 border rounded-xl">
                <button onclick="calculateShipping()" class="bg-stone-100 text-navy font-bold px-4 py-3 rounded-xl w-full hover:bg-stone-200 transition">Calcular Frete</button>
                <p id="shipping-result" class="text-sm text-emerald-600 font-bold hidden">Frete Padrão: R$ 12,00 (Entrega em 3 dias)</p>
            </div>
            
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-stone-200 space-y-4">
                <h3 class="font-bold text-xl mb-4 logo-font">2. Pagamento</h3>
                <div class="space-y-3">
                    <label class="flex items-center gap-3 p-4 border rounded-xl cursor-pointer hover:bg-stone-50"><input type="radio" name="pay" checked> PIX (Aprovação Imediata)</label>
                    <label class="flex items-center gap-3 p-4 border rounded-xl cursor-pointer hover:bg-stone-50"><input type="radio" name="pay"> Cartão de Crédito</label>
                </div>
                <button onclick="completeOrder()" class="bg-gold text-navy font-bold w-full py-4 rounded-xl text-lg hover:bg-navy hover:text-white transition shadow-xl mt-4">Confirmar Pagamento</button>
            </div>
        </div>
    </main>

    <script src="../script/script.js"></script>
</body>
</html>
